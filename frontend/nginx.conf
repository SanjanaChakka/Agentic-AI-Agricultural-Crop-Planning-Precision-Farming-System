server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the browser sees a single origin. This is what
    # lets the bundle keep the relative VITE_API_BASE_URL=/api/v1.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full workflow run trains nothing but does fan out to agents and the
        # weather provider; the default 60s is not always enough.
        proxy_read_timeout 180s;
        proxy_connect_timeout 15s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}